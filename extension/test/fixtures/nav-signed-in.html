<!doctype html>
<!--
================================================================================
  FIXTURE: nav-signed-in.html  —  Amazon US 全站导航栏（**已登录**）
================================================================================

  页面        : 任意一张带全站导航栏的页面（插件判登录态时开的是购物车页，
                URLS.loginProbe = {origin}/gp/cart/view.html）
  事实来源    : 报告里没有这一节 —— 厂商插件不判登录态，他们申请了 cookies 权限
                直接读 Cookie。我们**不申请** cookies 权限（CLAUDE.md 安全铁律），
                登录态只能从页面上看出来，所以这张夹具是按 Amazon 常见形态造的，
                可信度低一档：真出问题先怀疑它。

  ---------------------------------------------------------------------------
  本夹具覆盖的判据（parse.readLoginState，按可信度从高到低）
  ---------------------------------------------------------------------------
    #nav-item-signout                 存在 = 已登录（**只有签入的页面才发这个节点**）
                                      注意它在 display:none 的账户浮层里 ——
                                      判据要求"可见"的话，每张签入页都会读成 unknown
    #nav-link-accountList[href]       指向 /gp/css/homepage.html = 已登录
    #nav-link-accountList-nav-line-1  "Hello, David" —— 文案，只做辅助

  ---------------------------------------------------------------------------
  刻意塞进来的干扰项（写松了当场露馅）
  ---------------------------------------------------------------------------
    1. **排在最前面的隐藏模板**，里面是一整套"未登录"的导航栏：
       #nav-link-accountList href=/ap/signin + "Hello, sign in"。
       querySelector 只给第一个 —— 不挑可见节点的实现会把这张登录着的页面
       读成"已登出"，然后整个买家号被停掉派单。
    2. 页脚里一条 href 含 signin 的无关链接（真页面上到处都是）。
       实现要是全局扫 "有没有指向 signin 的链接"，这张页面就废了。
    3. 商品标题里带 "sign in" 三个字（"LED Neon Sign in Pink"）。
       实现要是全局扫页面文本，同样废。

  ---------------------------------------------------------------------------
  buyer 号 ID（parse.readCustomerId）
  ---------------------------------------------------------------------------
    页面上没有任何一个稳定的 DOM 节点带着它 —— 它是内联脚本里的一个字段，
    所以只能在整页 HTML 上跑正则（做法沿用厂商 v2.5.3 popup.js:212-228，
    他们拿它当身份用，我们只拿它对账与「登错号」比对）。

    真值：'customerId': 'A3KM7PLQ92XVYD'（**键上带引号**的那种写法）

    刻意摆在它前面的三个假值 —— 取第一个匹配就返回的实现（厂商就是这么写的）
    会在这里当场露馅，而露馅的方向恰好最坏：抠到一个空串送上去，服务端
    「这一列为空就首次写入」那条会把它写成这个买家号的身份：
      a) customerId: ""            未登录模板/埋点占位留下的空槽
      b) "customerId": "0"         A/B 实验里的默认值
      c) customerId: "A12"         形状对一半（A 开头但太短）
-->
<html lang="en">
<head><meta charset="utf-8"><title>Amazon.com Shopping Cart</title></head>
<body>

<!-- ① 干扰:隐藏的导航模板,内容是"未登录"那一套,而且排在真导航栏前面 -->
<div id="nav-flyout-template-shadow" style="display:none" aria-hidden="true">
  <div id="nav-tools">
    <a href="/ap/signin?openid.pape.max_auth_age=0&amp;ref_=nav_ya_signin" id="nav-link-accountList">
      <div id="nav-link-accountList-nav-line-1" class="nav-line-1">Hello, sign in</div>
      <span class="nav-line-2">Account &amp; Lists</span>
    </a>
  </div>
</div>

<!-- 真正的导航栏 -->
<header id="navbar-main">
  <div id="nav-belt">
    <div id="nav-tools">
      <a href="/gp/css/homepage.html?ref_=nav_youraccount_btn" class="nav-a nav-a-2" id="nav-link-accountList">
        <span id="nav-link-accountList-nav-line-1" class="nav-line-1 nav-progressive-content">Hello, David</span>
        <span class="nav-line-2">Account &amp; Lists</span>
      </a>
      <a href="/gp/css/order-history?ref_=nav_orders_first" id="nav-orders">
        <span class="nav-line-1">Returns</span>
        <span class="nav-line-2">&amp; Orders</span>
      </a>
      <a href="/gp/cart/view.html?ref_=nav_cart" id="nav-cart"><span id="nav-cart-count">2</span></a>
    </div>
  </div>

  <!-- 账户浮层:Amazon 默认 display:none,鼠标悬停才展开。
       #nav-item-signout 就在里面 —— 判据不能要求它"可见"。 -->
  <div id="nav-flyout-accountList" class="nav-flyout" style="display:none">
    <div id="nav-al-your-account" class="nav-template nav-flyout-content">
      <a href="/gp/css/homepage.html" class="nav-link">Your Account</a>
      <a href="/gp/css/order-history" class="nav-link">Your Orders</a>
      <a id="nav-item-signout" href="/gp/flushInterstitial.html?path=%2Fgp%2Fyourstore%2Fhome&amp;signIn=1&amp;useRedirectOnSuccess=1&amp;action=sign-out&amp;ref_=nav_AccountFlyout_signout" class="nav-link nav-item">Sign Out</a>
    </div>
  </div>
</header>

<div id="sc-active-cart">
  <div data-name="Active Items">
    <div class="sc-list-item" data-asin="B0FB3VS68J">
      <!-- ③ 干扰:商品标题里带 "sign in" -->
      <span class="a-truncate-full">LED Neon Sign in Pink — Hello, sign in Wall Art for Bedroom</span>
      <span class="sc-product-price">$12.99</span>
      <span data-a-selector="value">1</span>
    </div>
  </div>
</div>

<!-- ④ 干扰 + 真值:整页 HTML 上跑正则才抠得到的那一位。
     三个假值排在真值前面(空串 / "0" / 形状对一半),真值用的是键上带引号的写法。 -->
<script type="text/javascript">
  window.ue_furl = "fls-na.amazon.com";
  var uet_config = { customerId: "", sessionId: "133-2837465-9182736" };
  var ab_slot = { "customerId": "0", "weblab": "AMZ_PURCHASE_1234" };
  var legacy_hint = { customerId: "A12" };
  var P_config = { 'obfuscatedMarketplaceId': 'ATVPDKIKX0DER', 'customerId': 'A3KM7PLQ92XVYD' };
</script>

<footer id="navFooter">
  <ul class="nav_first">
    <!-- ② 干扰:页脚里含 signin 的无关链接 -->
    <li><a href="/ap/signin?openid.return_to=%2Fgp%2Fcss%2Fhomepage.html" class="nav_a">Your Account</a></li>
    <li><a href="/gp/help/customer/display.html" class="nav_a">Help</a></li>
  </ul>
  <span class="nav_copy">&copy; 1996-2026, Amazon.com, Inc.</span>
</footer>

</body>
</html>
